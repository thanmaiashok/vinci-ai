ackend/</text><text x="24.00" y="106" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- server.py          </text><text x="272.40" y="106" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># FastAPI REST API (/ask endpoint)</text><text x="24.00" y="132" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- llm_client.py      </text><text x="272.40" y="132" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Connects API to RAG agent</text><text x="24.00" y="158" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- frontend/</text><text x="24.00" y="184" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- index.html         </text><text x="272.40" y="184" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Chat UI</text><text x="24.00" y="210" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- script.js          </text><text x="272.40" y="210" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Fetch + DOM logic</text><text x="24.00" y="236" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- style.css          </text><text x="272.40" y="236" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Responsive styling</text><text x="24.00" y="262" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- rag/</text><text x="24.00" y="288" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- vinci_agent.py     </text><text x="272.40" y="288" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Main reasoning agent (routing logic)</text><text x="24.00" y="314" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- query_rag.py       </text><text x="272.40" y="314" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># FAISS retrieval engine</text><text x="24.00" y="340" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- build_index.py     </text><text x="272.40" y="340" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># One-time index builder</text><text x="24.00" y="366" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- ollama_client.py   </text><text x="272.40" y="366" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Ollama API wrapper</text><text x="24.00" y="392" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- config.py          </text><text x="272.40" y="392" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Paths and model settings</text><text x="24.00" y="418" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- data/</text><text x="24.00" y="444" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- vinci_labeled.jsonl  </text><text x="290.80" y="444" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Leonardo notebook entries (source KB)</text><text x="24.00" y="470" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- setup.bat              </text><text x="272.40" y="470" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># First-time setup script</text><text x="24.00" y="496" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- start_vinci_ai.bat     </text><text x="272.40" y="496" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Launch all services</text><text x="24.00" y="522" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|